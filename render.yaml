services:
  - type: web
    name: sanctuario-backend
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: NODE_ENV
        value: production

  - type: web
    name: sanctuario-client
    env: node
    plan: free
    buildCommand: cd client-app && npm install && npm run build
    startCommand: cd client-app && npm run serve
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3002
