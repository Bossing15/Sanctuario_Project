<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e824c" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0d3d23" stop-opacity="0.9" />
    </linearGradient>
    <pattern id="pattern-circles" width="50" height="50" patternUnits="userSpaceOnUse">
      <circle cx="25" cy="25" r="10" fill="#ffffff" fill-opacity="0.05" />
    </pattern>
  </defs>
  
  <!-- Main background -->
  <rect width="100%" height="100%" fill="url(#bg-gradient)" />
  
  <!-- Pattern overlay -->
  <rect width="100%" height="100%" fill="url(#pattern-circles)" />
  
  <!-- Decorative elements -->
  <circle cx="200" cy="200" r="100" fill="#ffffff" fill-opacity="0.1" />
  <circle cx="1720" cy="880" r="150" fill="#ffffff" fill-opacity="0.1" />
  
  <!-- Text indicating this is a placeholder -->
  <text x="960" y="540" font-family="Arial, sans-serif" font-size="40" fill="#ffffff" text-anchor="middle" opacity="0.3">
    Background Placeholder
  </text>
  <text x="960" y="600" font-family="Arial, sans-serif" font-size="24" fill="#ffffff" text-anchor="middle" opacity="0.3">
    Replace with your preferred background image
  </text>
</svg>